name: CI

on:
  push:
    branches: [main, 'research/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check existing evaluation integrity contract
        run: python3 scripts/test_deep_evaluation.py
      - name: Check terminology-drift inference boundaries
        run: python3 tests/test_model_terminology_drift_analysis.py
      - name: Check LTE snapshot-compression analysis boundaries
        run: python3 tests/test_lte_snapshot_compression.py
